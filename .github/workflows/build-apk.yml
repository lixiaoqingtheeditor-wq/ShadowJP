
name: Build ShadowJP V4 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        run: |
          unzip -q ShadowJP-V4-project.zip -d source
          chmod +x source/ShadowJP/gradlew

      - name: Run unit tests
        working-directory: source/ShadowJP
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: source/ShadowJP
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowJP-V4-debug-APK
          path: source/ShadowJP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
